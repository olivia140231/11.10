 "frankeNo": "N1.10", "nameZh": "瓊州公會", "nameAlt": "Ch'iung-chou kung-hui (Kheng Chew Association), Hainan Landsmannschaft", "origin": "海南群 (瓊州)", "color": "#d97706", "hasCoord": true, "lat": 1.55808, "lng": 110.346248, "dateISO": "1885", "dateRef": "N1.10.1", "address": "40, First Floor, Carpenter St, Main Bazaar, 93000 Kuching, Sarawak, Malaysia", "notes": ""}, {"id": "fm-wf-364", "frankeNo": "N1.11", "nameZh": "廣肇惠會館", "nameAlt": "Kuang Chao Hui hui-kuan, Landsmannschaft of people originating from the three prefectures of Kuang-chou, Chao-ch'ing, and Hui-chou", "origin": "廣府群 (粵)", "color": "#dc2626", "hasCoord": true, "lat": 1.552933, "lng": 110.364206, "dateISO": "1916", "dateRef": "N1.11.1", "address": "Lot 116-118, No. 80,82 & 84, Jalan Ang Cheng Ho, 93100 Kuching, Sarawak, Malaysia", "notes": ""}, {"id": "fm-wf-379", "frankeNo": "N8.3", "nameZh": "瓊州公會", "nameAlt": "Ch'iung-chou kung-hui, Hainan Landsmannschaft", "origin": "海南群 (瓊州)", "color": "#d97706", "hasCoord": false, "lat": null, "lng": null, "dateISO": "1949", "dateRef": "N8.3.1", "address": "", "notes": ""}, {"id": "fm-wf-382", "frankeNo": "N9.3", "nameZh": "客屬公會", "nameAlt": "K'o-shu kung-hui, Hakka Landsmannschaft", "origin": "客家群 (客屬)", "color": "#059669", "hasCoord": true, "lat": 4.390365, "lng": 113.985642, "dateISO": "1950", "dateRef": "N9.3.1", "address": "L2 , Centre Point Miri , Jalan Melayu , 98000 Miri , Sarawak, 98000, Malaysia", "notes": ""}, {"id": "fm-wf-383", "frankeNo": "N9.4", "nameZh": "詔安會館", "nameAlt": "Chao-an hui-kuan, Landsmannschaft of people from Chao-an county, Chang-chou prefecture", "origin": "閩籍 / 閩南群", "color": "#2563eb", "hasCoord": true, "lat": 4.422636, "lng": 114.004415, "dateISO": "1951", "dateRef": "N9.4.1", "address": "C2F3+3Q3 Valencia Park, Miri, Malaysia", "notes": ""}, {"id": "fm-wf-384", "frankeNo": "N9.5", "nameZh": "福州公會", "nameAlt": "Fu-chou kung-hui, (Miri Foochow Association), Landsmannschaft of people from Fu-chou prefecture", "origin": "閩籍 / 閩南群", "color": "#2563eb", "hasCoord": true, "lat": 4.421345, "lng": 114.004864, "dateISO": "1951", "dateRef": "N9.5.1", "address": "C2C3+GW Valencia Park, Miri, Malaysia", "notes": ""}];
        const summaryStats = [{"name": "閩籍 / 閩南群", "color": "#2563eb", "desc": "泉州、漳州、福州、興化、永春、安溪等閩南閩東原鄉", "total": 21, "geocoded": 20}, {"name": "廣府群 (粵)", "color": "#dc2626", "desc": "廣州府、肇慶府及四邑（新會、台山、開平、恩平）等粵語區", "total": 18, "geocoded": 17}, {"name": "客家群 (客屬)", "color": "#059669", "desc": "惠州府、嘉應州（梅縣）、大埔茶陽及閩西汀州永定等客家聚落", "total": 15, "geocoded": 12}, {"name": "海南群 (瓊州)", "color": "#d97706", "desc": "原廣東省瓊州府（海南島各縣）移民", "total": 14, "geocoded": 11}, {"name": "潮州群 (潮汕)", "color": "#9333ea", "desc": "廣東省潮州府八邑及韓江水系原鄉", "total": 4, "geocoded": 4}, {"name": "廣西群", "color": "#0891b2", "desc": "廣西省籍同鄉", "total": 2, "geocoded": 1}, {"name": "雷州群", "color": "#e11d48", "desc": "廣東省雷州半島籍移民（雷陽社）", "total": 1, "geocoded": 1}, {"name": "跨省 / 綜合機構", "color": "#475569", "desc": "跨省份或全省籍華人聯合會館與大會堂前身", "total": 5, "geocoded": 5}];

        let activeOrigins = new Set(summaryStats.map(s => s.name));
        let map = null;
        let markersLayer = null;

        // 1. Initialize Map
        function initMap() {
            // Center roughly around West Malaysia
            map = L.map('map', {
                zoomControl: true
            }).setView([3.8, 102.0], 7);

            // Base map: CartoDB Positron / OSM for clean contrast
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a> | Data: Nanyang Data (CC BY-SA 4.0)',
                subdomains: 'abcd',
                maxZoom: 19
            }).addTo(map);

            markersLayer = L.layerGroup().addTo(map);
            renderMarkers();
            renderLegend();
            renderChips();
            renderSitesList(pointsData);
        }

        // 2. Render Circle Markers on Map
        function renderMarkers() {
            markersLayer.clearLayers();
            const searchText = document.getElementById('searchInput') ? document.getElementById('searchInput').value.trim().toLowerCase() : '';

            let visibleCount = 0;
            pointsData.forEach(site => {
                if (!site.hasCoord) return;
                if (!activeOrigins.has(site.origin)) return;
                if (searchText && !(
                    site.nameZh.toLowerCase().includes(searchText) ||
                    site.nameAlt.toLowerCase().includes(searchText) ||
                    site.address.toLowerCase().includes(searchText)
                )) return;

                visibleCount++;

                const marker = L.circleMarker([site.lat, site.lng], {
                    radius: 7,
                    fillColor: site.color,
                    color: '#ffffff',
                    weight: 2,
                    opacity: 1,
                    fillOpacity: 0.9
                });

                const popupHtml = `
                    <div>
                        <div class="popup-title">${site.nameZh}</div>
                        <div class="popup-sub">${site.nameAlt}</div>
                        <span class="popup-badge" style="background:${site.color}">${site.origin}</span>
                        <div class="popup-detail">
                            <strong>Franke編號：</strong>${site.frankeNo}<br>
                            <strong>現存最早銘刻：</strong>${site.dateISO || '未詳'} (${site.dateRef || ''})<br>
                            <strong>現代地址：</strong>${site.address || '無現代地址紀錄'}<br>
                            ${site.notes ? `<strong>考證備註：</strong>${site.notes}` : ''}
                        </div>
                    </div>
                `;

                marker.bindPopup(popupHtml);
                markersLayer.addLayer(marker);
            });

            document.getElementById('totalVisibleCount').innerText = visibleCount;
        }

        // 3. Render Floating Legend
        function renderLegend() {
            const container = document.getElementById('legendItemsList');
            container.innerHTML = '';
            summaryStats.forEach(item => {
                const div = document.createElement('div');
                div.className = 'legend-item';
                div.innerHTML = `
                    <span class="legend-color" style="background:${item.color}"></span>
                    <span>${item.name} (${item.geocoded}處)</span>
                `;
                container.appendChild(div);
            });
        }

        // 4. Render Origin Group Chips
        function renderChips() {
            const container = document.getElementById('chipsContainer');
            container.innerHTML = '';
            summaryStats.forEach(item => {
                const chip = document.createElement('button');
                const isActive = activeOrigins.has(item.name);
                chip.className = `chip ${isActive ? 'active' : ''}`;
                chip.style.borderColor = isActive ? item.color : '#cbd5e1';
                chip.innerHTML = `
                    <span class="chip-dot" style="background:${item.color}"></span>
                    <span>${item.name}</span>
                    <span class="chip-count">(${item.geocoded})</span>
                `;
                chip.onclick = () => toggleOrigin(item.name);
                container.appendChild(chip);
            });
        }

        // 5. Toggle Origin filter
        function toggleOrigin(name) {
            if (activeOrigins.has(name)) {
                if (activeOrigins.size > 1) {
                    activeOrigins.delete(name);
                } else {
                    // If clicking the only active, restore all
                    activeOrigins = new Set(summaryStats.map(s => s.name));
                }
            } else {
                activeOrigins.add(name);
            }
            renderChips();
            renderMarkers();
            filterSites();
        }

        function resetFilters() {
            activeOrigins = new Set(summaryStats.map(s => s.name));
            if (document.getElementById('searchInput')) {
                document.getElementById('searchInput').value = '';
            }
            renderChips();
            renderMarkers();
            filterSites();
        }

        // 6. Render Sites in Sidebar List
        function renderSitesList(items) {
            const container = document.getElementById('sitesList');
            container.innerHTML = '';
            if (items.length === 0) {
                container.innerHTML = '<div style="padding:24px; text-align:center; color:#94a3b8; font-size:13px;">查無相符會館組織</div>';
                return;
            }

            items.forEach(site => {
                const card = document.createElement('div');
                card.className = 'site-card';
                card.innerHTML = `
                    <div class="site-card-top">
                        <span class="site-card-name">${site.nameZh}</span>
                        <span class="site-card-tag" style="background:${site.color}">${site.origin}</span>
                    </div>
                    <div class="site-card-sub">${site.nameAlt}</div>
                    <div class="site-card-foot">
                        <span>最早銘刻: ${site.dateISO || '未詳'}</span>
                        <span class="${site.hasCoord ? 'badge-mapped' : 'badge-unmapped'}">
                            ${site.hasCoord ? '● 已在地圖標註' : '○ 無座標'}
                        </span>
                    </div>
                `;

                card.onclick = () => {
                    if (site.hasCoord && map) {
                        map.flyTo([site.lat, site.lng], 15, { duration: 1.2 });
                        // Find marker and open popup
                        markersLayer.eachLayer(layer => {
                            if (layer.getLatLng && layer.getLatLng().lat === site.lat && layer.getLatLng().lng === site.lng) {
                                layer.openPopup();
                            }
                        });
                        // Close sidebar on mobile
                        if (window.innerWidth <= 768) {
                            toggleSidebar(false);
                        }
                    } else {
                        alert(`${site.nameZh} (${site.origin}) 在原書中記錄但暫無現代座標。\n地址: ${site.address || '無'}`);
                    }
                };

                container.appendChild(card);
            });
        }

        // 7. Filter Sites based on search & active origins
        function filterSites() {
            const q = document.getElementById('searchInput').value.trim().toLowerCase();
            const filtered = pointsData.filter(site => {
                const matchOrigin = activeOrigins.has(site.origin);
                const matchSearch = !q || (
                    site.nameZh.toLowerCase().includes(q) ||
                    site.nameAlt.toLowerCase().includes(q) ||
                    site.origin.toLowerCase().includes(q) ||
                    (site.dateISO && site.dateISO.toLowerCase().includes(q)) ||
                    (site.address && site.address.toLowerCase().includes(q))
                );
                return matchOrigin && matchSearch;
            });

            renderSitesList(filtered);
            renderMarkers();
        }

        // 8. Toggle Sidebar on Mobile
        function toggleSidebar(forceState) {
            const sidebar = document.getElementById('sidebar');
            if (forceState !== undefined) {
                if (forceState) sidebar.classList.add('mobile-open');
                else sidebar.classList.remove('mobile-open');
            } else {
                sidebar.classList.toggle('mobile-open');
            }
        }

        window.addEventListener('DOMContentLoaded', initMap);
    </script>
